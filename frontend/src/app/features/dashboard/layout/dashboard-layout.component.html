<div class="flex h-screen overflow-hidden font-['Plus_Jakarta_Sans',sans-serif] bg-[#0b0c16] text-[#f8fafc]">

  <!-- 1. Menú Lateral (Sidebar) -->
  <aside class="w-64 glass-card flex flex-col justify-between p-5 border-r border-violet-900/30 shrink-0">
    <div class="space-y-6">
      <!-- Logo con Imagen Real -->
      <div class="flex items-center gap-3">
        @if (!logoError()) {
          <img
            src="assets/logoLima.png"
            alt="Logo Lima"
            class="w-10 h-10 object-contain drop-shadow-[0_0_12px_rgba(139,92,246,0.4)]"
            (error)="onLogoError()"
          />
        } @else {
          <div class="w-10 h-10 rounded-xl bg-violet-600/30 flex items-center justify-center text-violet-300 font-bold border border-violet-500/30">
            CG
          </div>
        }
        <div>
          <h1 class="font-bold text-sm tracking-wide text-white">CONTROL</h1>
          <p class="text-xs text-violet-400 font-medium">de Gastos</p>
        </div>
      </div>

      <!-- Navegación: Reactiva a Rutas y CSS -->
      <nav class="space-y-1.5 text-xs">
        @for (item of navItems; track item.id) {
          <a
            [id]="item.id"
            [routerLink]="item.route"
            routerLinkActive="nav-btn-active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800/40 hover:text-slate-200 transition text-left cursor-pointer">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"></path>
            </svg>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    </div>

    <!-- Perfil Personal (Google OAuth / Local Session) -->
    <div class="glass-card p-3 rounded-xl flex items-center justify-between border-slate-700/50">
      <div class="flex items-center gap-2.5 overflow-hidden">
        @if (userAvatarUrl) {
          <img
            [src]="userAvatarUrl"
            [alt]="userDisplayName"
            class="w-8 h-8 rounded-full object-cover border border-violet-400/40 shadow-sm shrink-0"
          />
        } @else {
          <div
            class="w-8 h-8 rounded-full bg-gradient-to-tr flex items-center justify-center font-bold text-white text-xs shrink-0 shadow-sm"
            [ngClass]="avatarGradientClass">
            {{ userInitial }}
          </div>
        }

        <div class="overflow-hidden">
          <p class="text-xs font-bold leading-none text-slate-200 truncate" [title]="userDisplayName">{{ userDisplayName }}</p>
          <span class="text-[10px] text-violet-400 font-semibold">{{ currentUser()?.role === 'ADMIN' ? 'Admin' : 'Personal' }}</span>
        </div>
      </div>
      <button
        id="btn-layout-logout"
        type="button"
        (click)="logout()"
        class="text-xs text-rose-400 hover:text-rose-300 font-medium transition cursor-pointer shrink-0 ml-2">
        Salir
      </button>
    </div>
  </aside>

  <!-- 2. Área Principal de Contenido con Scroll Global Fluido -->
  <main class="flex-1 flex flex-col h-screen overflow-y-auto overflow-x-hidden">
    <router-outlet></router-outlet>
  </main>

</div>
